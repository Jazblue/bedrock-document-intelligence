<!DOCTYPE html>
<html>

<head>

<title>Documents</title>

<style>

body {
    font-family: Arial;
    width:900px;
    margin:40px auto;
}

nav a {
    text-decoration:none;
    margin-right:15px;
    font-weight:bold;
}

.card {
    background:#f4f4f4;
    padding:20px;
    margin:15px 0;
    border-radius:8px;
}

button {
    background:#FF9900;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

.checkbox {
    transform:scale(1.3);
}

.compare-box {
    background:#232F3E;
    color:white;
    padding:20px;
    border-radius:8px;
    margin-bottom:20px;
}

</style>

</head>


<body>


<nav>

<a href="/">🏠 Home</a> |
<a href="/documents">📄 Documents</a> |
<a href="/history">📜 History</a>
<a href="/comparison_history">
📊 Comparison History
</a>

</nav>


<hr>


<h1>
📄 My Documents
</h1>


<form action="/compare" method="POST">


<div class="compare-box">

<h2>
🔍 Compare Documents
</h2>

<p>
Select two or more documents and click compare.
</p>

<button type="submit">
Compare Selected Documents
</button>

</div>



{% for item in documents %}


<div class="card">


<input
class="checkbox"
type="checkbox"
name="documents"
value="{{ item.document_id }}"
>


<b>
📄 {{ item.document_id }}
</b>


<p>
<b>Type:</b> {{ item.document_type }}
</p>


<p>
<b>Action:</b> {{ item.action }}
</p>


<a href="/chat?document_id={{ item.document_id }}">
<button type="button">
💬 Chat
</button>
</a>


<a href="/delete/{{ item.document_id }}">
<button type="button">
🗑 Delete
</button>
</a>


</div>


{% endfor %}



</form>


</body>

</html>
